<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>骨董品図鑑</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
	<div id="book" class="hidden">
		<button id="close-button" title="閉じる">×</button>

		<div id="progress-line"></div>

		<div id="flip-viewport">
			<button id="prev-button" class="nav-arrow nav-prev" title="前のシート">◀</button>
			<div id="page">
				<div id="sheet-title"></div>
				<div id="grid"></div>
			</div>
			<button id="next-button" class="nav-arrow nav-next" title="次のシート">▶</button>
		</div>
	</div>

	<div id="modal" class="hidden">
		<div id="modal-card">
			<button id="modal-close" title="閉じる">×</button>
			<div id="modal-image"></div>
			<div id="modal-name"></div>
			<div id="modal-desc"></div>
		</div>
	</div>

	<script src="script.js"></script>
</body>
</html>
